# Referência da configuração do site no Render (Static Site).
# Os cabeçalhos abaixo também estão aplicados no painel do Render.
services:
  - type: web
    name: projeto-cn
    runtime: static
    staticPublishPath: .
    buildCommand: ""
    headers:
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
      - path: /*
        name: Referrer-Policy
        value: strict-origin-when-cross-origin
      - path: /*
        name: X-Frame-Options
        value: SAMEORIGIN
      - path: /*
        name: Permissions-Policy
        value: camera=(), microphone=(), geolocation=()
      - path: /memes/*
        name: Cache-Control
        value: no-cache
